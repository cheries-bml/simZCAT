<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="app-page" hidden>
  <header class="topbar">
    <a id="brand" class="brand" href="#overview" aria-label="Home"></a>
    <nav id="nav" class="nav" aria-label="Sections"></nav>
    <div class="topbar-user">
      <span id="user-name"></span>
      <span id="user-role" class="badge"></span>
      <button id="logout-btn" class="btn btn-ghost" type="button">Sign out</button>
    </div>
  </header>

  <main id="content" class="content" tabindex="-1"></main>

  <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>

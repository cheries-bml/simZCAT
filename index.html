<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduCAT — Computer Assisted Testing & Teaching</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Lucide Icons (Free & Reliable CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Marked.js for Markdown Material Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <!-- LOGIN VIEW -->
  <main id="login-view" class="auth-container">
    <div class="auth-card">
      <div class="brand-header">
        <i data-lucide="graduation-cap" class="brand-icon"></i>
        <h1 id="app-title">EduCAT</h1>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-icon">
            <i data-lucide="user"></i>
            <input type="text" id="username" required autocomplete="username" placeholder="Enter username" />
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon">
            <i data-lucide="lock"></i>
            <input type="password" id="password" required autocomplete="current-password" placeholder="Enter password" />
          </div>
        </div>
        <p id="login-error" class="error-msg hidden"></p>
        <button type="submit" class="btn btn-primary btn-block">
          <i data-lucide="log-in"></i> Sign In
        </button>
      </form>
    </div>
  </main>

  <!-- APP SHELL -->
  <div id="app-shell" class="app-layout hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i data-lucide="graduation-cap"></i>
        <span id="sidebar-title">EduCAT</span>
      </div>
      <nav id="nav-menu" class="nav-links"></nav>
      <div class="sidebar-footer">
        <div class="user-badge">
          <i data-lucide="shield-check"></i>
          <div>
            <div id="user-display-name" class="user-name">User</div>
            <div id="user-display-role" class="user-role">Role</div>
          </div>
        </div>
        <button id="logout-btn" class="btn btn-ghost btn-block">
          <i data-lucide="log-out"></i> Logout
        </button>
      </div>
    </aside>

    <section class="main-content">
      <!-- 1. TEST GENERATOR & CAT LAUNCHER -->
      <div id="view-cat" class="view-section hidden">
        <div class="card" id="cat-setup-panel">
          <h2><i data-lucide="sliders"></i> Test Configuration</h2>
          <div class="grid-form">
            <div class="form-group">
              <label for="bank-select">Question Bank</label>
              <select id="bank-select"></select>
            </div>
            <div class="form-group">
              <label for="difficulty-select">Difficulty</label>
              <select id="difficulty-select">
                <option value="all">All Levels</option>
                <option value="easy">Easy (Level 1–2)</option>
                <option value="intermediate">Intermediate (Level 3)</option>
                <option value="advanced">Advanced (Level 4–5)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="question-count">Number of Questions</label>
              <input type="number" id="question-count" min="1" max="100" value="5" />
            </div>
          </div>
          <button id="start-test-btn" class="btn btn-primary">
            <i data-lucide="play"></i> Start CAT Session
          </button>
        </div>

        <div id="cat-exam-panel" class="hidden">
          <div class="exam-header card">
            <div>
              <span id="exam-title" class="badge">Exam</span>
              <span id="exam-progress" class="muted">Question 1 of 1</span>
            </div>
            <div id="exam-timer" class="timer-badge hidden">
              <i data-lucide="clock"></i> <span id="timer-text">00:00</span>
            </div>
          </div>
          <div id="cat-question-container" class="card"></div>
          <div class="exam-controls">
            <button id="prev-q-btn" class="btn btn-secondary"><i data-lucide="chevron-left"></i> Previous</button>
            <button id="next-q-btn" class="btn btn-secondary">Next <i data-lucide="chevron-right"></i></button>
            <button id="submit-exam-btn" class="btn btn-success"><i data-lucide="check-circle"></i> Submit Test</button>
          </div>
        </div>

        <div id="cat-result-panel" class="card hidden"></div>
      </div>

      <!-- 2. TEACHING / DISCUSSION MODE -->
      <div id="view-teaching" class="view-section hidden">
        <div class="card">
          <div class="toolbar">
            <h2><i data-lucide="presentation"></i> Interactive Teaching Mode</h2>
            <div class="toolbar-actions">
              <select id="teach-bank-select"></select>
              <button id="toggle-all-answers" class="btn btn-secondary">
                <i data-lucide="eye"></i> Toggle Answer & Explanation
              </button>
            </div>
          </div>
          <div id="teaching-container"></div>
        </div>
      </div>

      <!-- 3. STUDY MATERIALS -->
      <div id="view-materials" class="view-section hidden">
        <div class="materials-grid">
          <div class="card">
            <h2><i data-lucide="folder-open"></i> Materials</h2>
            <ul id="materials-list" class="material-list"></ul>
          </div>
          <div class="card material-viewer-card">
            <div id="material-viewer" class="material-viewer">
              <p class="muted">Select a document or image to view.</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 4. SUPER ROLE ONLY: SYSTEM DIAGNOSTICS -->
      <div id="view-admin" class="view-section hidden">
        <div class="card">
          <h2><i data-lucide="terminal"></i> System Configuration & Diagnostics</h2>
          <pre id="super-diagnostics" class="code-block"></pre>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

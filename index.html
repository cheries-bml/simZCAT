<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <script src="assets/js/theme-boot.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="login-page">
  <aside class="login-brand">
    <h1 id="app-name" class="login-logo"></h1>
    <p id="app-tagline"></p>
  </aside>

  <main class="login-panel">
    <div class="login-theme" id="theme-controls"></div>
    <form id="login-form" class="login-form" novalidate>
      <h2>Sign in</h2>

      <label for="username">Username</label>
      <div class="input-wrap"><span class="input-icon" data-icon="user"></span><input id="username" name="username" type="text" autocomplete="username" required autofocus></div>

      <label for="password">Password</label>
      <div class="input-wrap"><span class="input-icon" data-icon="lock"></span><input id="password" name="password" type="password" autocomplete="current-password" required></div>

      <button id="login-btn" type="submit" class="btn">Sign in</button>
    </form>
  </main>

  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
